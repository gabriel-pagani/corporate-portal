{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}{% endblock %} | Grupo SMI</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="{% static 'global/images/icon.png' %}" rel="icon" />
    <link href="{% static 'global/css/reset.css' %}" rel="stylesheet" />
    {% if request.user.is_authenticated %}
    <link href="{% static 'global/css/notifications.css' %}" rel="stylesheet" />
    {% endif %}
    {% block head %}{% endblock %}
  </head>
  <body>
    {% block body %}{% endblock %}
    {% if request.user.is_authenticated %}
    <div class="notifications" id="notifications" aria-live="polite"
      data-api-url="{% url 'app:notifications-api' %}"
      data-csrf-token="{{ csrf_token }}"
    ></div>
    <script src="{% static 'global/js/notifications.js' %}"></script>
    {% endif %}
  </body>
</html>
