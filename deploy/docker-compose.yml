name: intranet

services:
  postgres:
    image: postgres:16
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - backend
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    expose:
      - "6379"
    # O Redis guarda as sessões, e o cache do Django lê pickle dele: quem escreve
    # aqui forja a sessão de qualquer um e executa código no Django. A imagem
    # oficial sobe sem senha e sem protected-mode.
    #
    # A senha vai pela variável, e não pela linha de comando do compose, para não
    # aparecer no docker inspect. O redis-cli do healthcheck lê a mesma variável.
    # O docker-entrypoint.sh é o que troca o root pelo usuário redis.
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?defina REDIS_PASSWORD no deploy/.env}
    command: ["sh", "-c", "exec docker-entrypoint.sh redis-server --requirepass \"$$REDISCLI_AUTH\" --appendonly yes --save ''"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - backend
    restart: unless-stopped

  django:
    build:
      context: ../
      dockerfile: deploy/Dockerfile
      target: production
    image: intranet-django
    expose:
      - "8000"
    volumes:
      - static_volume:/app/static_root
    env_file:
      - .env
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn project.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 2 --timeout 60 --access-logfile - --error-logfile -"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import socket; s=socket.socket(); s.settimeout(2); s.connect((\"127.0.0.1\",8000)); s.close()'"]
      interval: 5s
      timeout: 5s
      retries: 12
    # O único na frente e atrás: o proxy fala com ele, e ele com o banco. A rede
    # da frente também é a saída dele para o AD, o RM e o Metabase.
    networks:
      - backend
      - frontend
    restart: unless-stopped

  tests:
    build:
      context: ../
      dockerfile: deploy/Dockerfile
      target: test
    image: intranet-django-tests
    volumes:
      - ../app:/app/app
      - ../journey_audit:/app/journey_audit
      - ../project:/app/project
      - ../templates:/app/templates
      - ../static:/app/static
      - ../tests:/app/tests
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python -m pytest -vv
    profiles:
      - tests
    networks:
      - backend

  nginx:
    image: nginx:1.30-alpine
    # Sem porta publicada no host: quem alcança o nginx é o túnel, pela rede do
    # compose. O TLS termina na Cloudflare, e não existe entrada em HTTP.
    expose:
      - "80"
    volumes:
      - static_volume:/app/static_root
      - ./http.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      django:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 80"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - frontend
    restart: unless-stopped

  cloudflare:
    image: cloudflare/cloudflared:2026.10.4
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TOKEN}
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - frontend
    restart: unless-stopped

volumes:
  static_volume:
  postgres_data:
  redis_data:

networks:
  # Banco e Redis ficam só aqui: sem saída para fora, e fora do alcance do nginx
  # e do túnel, que são as peças expostas.
  backend:
    internal: true
  frontend:
